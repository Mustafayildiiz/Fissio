openapi: 3.0.3
info:
  title: Fissio API
  version: 0.1.0
  description: |
    Fissio mikroservis API sözleşmesi. Üç servis ayrı portlardan yayın yapar:
    auth (:8081), expense (:8082), ocr (:8083).
    Kimlik doğrulama: `Authorization: Bearer <access_token>`. Access token kısa ömürlüdür (15 dakika);
    süresi dolunca `POST /auth/refresh` ile (tek kullanımlık, rotasyonlu) refresh token'dan yenilenir.
    Oturumu iptal edilen (çıkış, uzaktan çıkış, şifre sıfırlama, hesap silme) token'lar süresi dolmadan
    `401 session_revoked` döner. Hata gövdesi: `{ error, code }` (`code` makine okunur).
    Hesap izolasyonu: User → Profiles → Receipts. Her profil/fiş yalnızca sahibi hesaba görünür; başka
    hesabın kaynağına erişim `404` döner. `client_uid` hesap başına tekildir (idempotent kayıt / içe aktarma).
servers:
  - url: http://localhost:8081
    description: auth
  - url: http://localhost:8082
    description: expense
  - url: http://localhost:8083
    description: ocr
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, description: 'En az 8 karakter, bir rakam ve bir büyük harf (en çok 72 bayt)' }
        name: { type: string, description: 'Yalnızca kayıtta; en çok 80 karakter' }
        device_name: { type: string, description: 'Oturum listesinde gösterilir (örn. Pixel 8)' }
        platform: { type: string, description: 'android | ios | ...' }
    TokenPair:
      type: object
      properties:
        access_token: { type: string, description: '15 dakika geçerli JWT (sub, sid, typ=access)' }
        refresh_token: { type: string, description: 'Opak, 30 gün, tek kullanımlık (DB de hash li). Her yenilemede değişir.' }
        expires_at: { type: string, format: date-time, description: access_token bitişi }
        user:
          type: object
          properties:
            id: { type: integer, format: int64 }
            email: { type: string }
            name: { type: string }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        current: { type: boolean, description: İsteği yapan oturum }
    Profile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 40 }
        client_uid: { type: string, description: İstemci kimliği; aynı uid ile POST idempotenttir }
        created_at: { type: string, format: date-time }
        avatar_version: { type: integer, description: '0 = avatar yok; her yüklemede artar (avatar URL''sine ?v= eklenerek önbellek kırılır)' }
    BulkResult:
      type: object
      properties:
        created: { type: integer }
        skipped: { type: integer, description: client_uid zaten kayıtlı olanlar (mükerrer oluşturulmaz) }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              client_uid: { type: string }
              status: { type: string, enum: [created, skipped, error] }
              id: { type: integer, format: int64 }
              error: { type: string }
    Item:
      type: object
      description: >-
        Fiş kalemi. Kalem kategorisi opsiyoneldir (0/yok = atanmamış); kayıtta yalnızca
        name, amount ve category_id saklanır. category_confidence / category_source /
        category_review yalnızca `ParsedReceipt` içinde döner; suggested_category_id yalnızca
        istekte kullanılır.
      properties:
        name: { type: string }
        amount: { type: number }
        category_id: { type: integer, description: Kalem kategorisi (otomatik atanır, kullanıcı değiştirebilir) }
        category_name: { type: string }
        category_confidence:
          type: number
          description: Otomatik kalem kategorisi güveni (0-1); yalnızca ayrıştırma çıktısında.
        category_source:
          type: string
          enum: [rule, keyword, merchant, fallback]
          description: >-
            rule = kullanıcının önceki düzeltmesi, keyword = ürün sözlüğü, merchant = sözlükte yok,
            işletme kategorisi miras alındı, fallback = güven yetersiz ("Diğer").
        category_review:
          type: boolean
          description: true ise kalem kategorisi güvenilir değil ("Diğer"e düşüldü); istemci kontrol ettirmeli.
        suggested_category_id:
          type: integer
          description: >-
            İstek: tarama sırasında önerilen kalem kategorisi. category_id'den farklıysa düzeltme
            sayılır ve kullanıcının kişisel kuralı olarak öğrenilir.
    ExpenseInput:
      type: object
      properties:
        merchant: { type: string }
        amount: { type: number }
        date: { type: string, format: date }
        category_id: { type: integer }
        suggested_category_id:
          type: integer
          description: >-
            Tarama sırasında önerilen fiş kategorisi. category_id'den farklıysa kullanıcı düzeltmesi
            sayılır ve işletme adı için kişisel kural olarak saklanır (sonraki taramalarda uygulanır).
        note: { type: string }
        profile_id:
          type: integer
          format: int64
          description: >-
            Fişin profili (hesabın kendi profili olmalı; yoksa 404). Boş/0 = varsayılan (en eski) profil.
            Güncellemede verilmezse profil korunur, verilirse fiş o profile taşınır.
        client_uid:
          type: string
          description: >-
            İstemci/dışa aktarma kimliği (`[A-Za-z0-9._:-]{1,64}`). Aynı hesapta aynı uid tekrar gelirse
            kayıt mükerrer oluşmaz (`POST /expenses` mevcut kaydı 200 ile döner). Boşsa sunucu üretir.
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    Expense:
      allOf:
        - $ref: '#/components/schemas/ExpenseInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            category_name: { type: string }
            image_ids:
              type: array
              description: Fişe bağlı fotoğraf kimlikleri (sıralı); yoksa [].
              items: { type: integer, format: int64 }
    CategoryRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [merchant, item] }
        pattern: { type: string, description: Normalize edilmiş anahtar (küçük harf, ASCII, rakam/birim ayıklanmış) }
        category_id: { type: integer }
        category_name: { type: string }
        hits: { type: integer, description: Kuralın kaç kez doğrulandığı/güncellendiği }
        updated_at: { type: string, format: date-time }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        keywords:
          type: array
          items: { type: string }
    ParsedReceipt:
      type: object
      properties:
        merchant: { type: string }
        amount: { type: number, nullable: true }
        date: { type: string, nullable: true }
        category_id: { type: integer }
        category_name: { type: string }
        category_source:
          type: string
          enum: [rule, merchant, keyword, items, fallback]
          description: >-
            rule = kullanıcı kuralı, merchant = fiş başlığında tanınan işletme, keyword = yalnızca fiş
            gövdesinde zayıf eşleşme, items = kalemlerin ağırlıklı oylaması, fallback = güven yetersiz → "Diğer".
        category_needs_review:
          type: boolean
          description: >-
            Kategori güveni düşük ya da "Diğer"e düşüldü; istemci kategoriyi varsayılan seçili getirir ama
            kullanıcıya kontrol ettirir. `needs_review`'dan (toplam uyuşmazlığı) bağımsızdır.
        category_candidates:
          type: array
          description: Hızlı seçim için en fazla 3 aday kategori (puana göre azalan).
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              score: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        confidence:
          type: object
          properties:
            amount: { type: number }
            date: { type: number }
            merchant: { type: number }
            category: { type: number }
        needs_manual:
          type: boolean
          description: Tutar bulunamadıysa true; istemci manuel giriş modalını gösterir.
        needs_review:
          type: boolean
          description: Kalem fiyatları toplamı fiş toplamıyla tutmuyorsa true; istemci uyuşmazlık uyarısı gösterir.
        items_total:
          type: number
          nullable: true
          description: Hesaplanan kalem toplamı (yalnızca needs_review true iken).
        discount_total:
          type: number
          description: >-
            Kalem toplamından düşülecek indirim (İNDİRİM/İSKONTO satırları kalem değildir).
            Kaydedilecek tutar = kalemler − discount_total. İndirim yoksa ya da kalemlere zaten
            yansımışsa alan yoktur.
        summary:
          type: object
          description: Fişin özet satırları (kalem değildir); toplam doğrulaması için metadata.
          properties:
            subtotal: { type: number, description: ARA TOPLAM }
            discounts:
              type: array
              description: Kalem bölgesindeki indirim satırlarının tutarları (pozitif).
              items: { type: number }
            vat_total: { type: number, description: TOPKDV / TOPLAM KDV }
            paid_cash: { type: number, description: NAKİT }
            paid_card: { type: number, description: KREDİ / BANKA KARTI }
            change: { type: number, description: PARA ÜSTÜ }
        reconciliation:
          type: object
          description: Kalemler toplamı (− indirim) ile fiş toplamının mutabakat sonucu.
          properties:
            status:
              type: string
              enum: [ok, discount_applied, duplicate_removed, mismatch]
            diff:
              type: number
              description: (kalemler − indirim) − fiş toplamı, düzeltmelerden sonra (0 = tutarlı).
            suspect_index:
              type: integer
              description: >-
                Farkı tek başına açıklayan, ama çift okuma kanıtı olmadığı için silinmeyen kalemin
                items içindeki sırası.
            reason:
              type: string
              description: >-
                removed_duplicate: <ad> | excess_equals_item | missing_equals_item |
                missing_equals_skipped_line: <satır> | discount_already_in_items
    OcrResult:
      type: object
      properties:
        raw_text: { type: string }
        blocks:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              confidence: { type: number }
              bbox:
                type: array
                items:
                  type: array
                  items: { type: number }
        confidence: { type: number }
        engine: { type: string, enum: [paddleocr, custom] }
        model_version: { type: string }
        elapsed_ms: { type: number }
        is_empty: { type: boolean }
    ReportSummary:
      type: object
      properties:
        period: { type: string, enum: [week, month] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { type: number }
        count: { type: integer }
        by_category:
          type: array
          items:
            type: object
            properties:
              category_id: { type: integer }
              name: { type: string }
              total: { type: number }
              count: { type: integer }
              percent: { type: number }
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Kayıt (6 haneli e-posta doğrulama kodu gönderir)
      description: >-
        Hesap e-posta doğrulanana kadar aktif değildir. Doğrulanmamış aynı e-posta tekrar kaydolursa
        şifre/ad güncellenir ve yeni kod gönderilir. SMTP yapılandırılmamışsa kod yalnızca auth loguna yazılır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { description: 'Kod gönderildi: { email, verification_required, resend_after_seconds, expires_in_seconds }' }
        '400': { description: 'invalid_email | weak_password' }
        '409': { description: 'email_taken (doğrulanmış hesap)' }
        '429': { description: 'resend_cooldown (retry_after) | too_many_codes | rate_limited' }
        '502': { description: email_send_failed }
  /auth/verify-email:
    post:
      tags: [auth]
      summary: E-posta doğrulama kodunu onayla (otomatik giriş)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string, description: 6 haneli kod, 10 dakika geçerli, tek kullanımlık }
                device_name: { type: string }
                platform: { type: string }
      responses:
        '200': { description: Oturum açıldı, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '400': { description: 'invalid_code | code_expired' }
        '429': { description: 'too_many_attempts (kod başına en çok 5 deneme)' }
  /auth/resend-code:
    post:
      tags: [auth]
      summary: Doğrulama kodunu yeniden gönder (60 sn bekleme, saatte en çok 5)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Kabul edildi (hesap varlığı sızdırılmaz) }
        '429': { description: 'resend_cooldown (retry_after saniye) | too_many_codes' }
  /auth/login:
    post:
      tags: [auth]
      summary: Giriş
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { description: Oturum açıldı, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { description: invalid_credentials }
        '403': { description: 'email_not_verified (şifre doğruysa yeni kod gönderilir)' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Access token yenile (refresh token rotasyonu)
      description: >-
        Refresh token tek kullanımlıktır; yanıttaki yeni refresh token saklanmalıdır. Rotasyondan sonra eski token
        için 45 sn tolerans vardır (yeni çifti kaydetmeden kapanan uygulama oturumunu kaybetmesin); bu
        süreden sonra eski token yeniden kullanılırsa çalıntı sayılır ve oturum iptal edilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
      responses:
        '200': { description: Yeni çift, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { description: 'invalid_refresh | session_revoked' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Bu refresh token oturumunu kapat (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { refresh_token: { type: string } } }
      responses:
        '204': { description: Kapatıldı }
  /auth/logout-all:
    post:
      tags: [auth]
      summary: Tüm cihazlardan çıkış (tüm oturumlar ve refresh token lar geçersiz)
      security: [{ bearer: [] }]
      responses:
        '204': { description: Tüm oturumlar kapatıldı }
  /auth/sessions:
    get:
      tags: [auth]
      summary: Açık oturumlar (cihaz, platform, son aktiflik)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }
  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Tek bir cihazdaki oturumu uzaktan kapat
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Kapatıldı }
        '404': { description: Oturum yok veya başka hesaba ait }
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Şifre sıfırlama kodu gönder
      description: Hesap var/yok ayrımı sızdırılmaz; her zaman 202 döner. Kod yalnızca doğrulanmış hesaplara gider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Kabul edildi }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Kodla yeni şifre belirle (tüm oturumlar kapanır)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: { type: string }
                code: { type: string }
                new_password: { type: string }
      responses:
        '204': { description: Şifre güncellendi }
        '400': { description: 'invalid_code | code_expired | weak_password' }
        '429': { description: too_many_attempts }
  /auth/account:
    delete:
      tags: [auth]
      summary: Hesabı kalıcı sil (KVKK/GDPR)
      description: >-
        Şifre onayıyla çalışır. Hesap, tüm profiller, fişler, fiş görselleri, kategori kuralları, oturumlar
        ve doğrulama kodları tek işlemde kalıcı olarak silinir.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        '204': { description: Silindi }
        '403': { description: invalid_credentials }
  /auth/me:
    get:
      tags: [auth]
      summary: Geçerli kullanıcı
      security: [{ bearer: [] }]
      responses:
        '200': { description: 'id, email, name, created_at, email_verified' }
        '401': { description: 'unauthorized | session_revoked' }
  /profiles:
    get:
      tags: [expense]
      summary: Hesabın profilleri (hiç yoksa varsayılan "Kişisel" otomatik oluşturulur)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Profile' } }
    post:
      tags: [expense]
      summary: Profil oluştur (client_uid ile idempotent; hesap başına en çok 20)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                client_uid: { type: string }
      responses:
        '201': { description: Oluşturuldu, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '200': { description: Aynı client_uid ile profil zaten var }
        '400': { description: Geçersiz ad / çok fazla profil }
  /profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [expense]
      summary: Profili yeniden adlandır
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        '200': { description: Güncellendi }
        '404': { description: Profil yok veya başka hesaba ait }
    delete:
      tags: [expense]
      summary: Profili ve içindeki tüm fişleri (görseller dahil) sil. Son profil silinemez.
      security: [{ bearer: [] }]
      responses:
        '204': { description: Silindi }
        '400': { description: last_profile }
        '404': { description: Profil yok veya başka hesaba ait }
  /profiles/{id}/avatar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [expense]
      summary: Profil fotoğrafını yükle / değiştir
      description: Tek `file` alanı; jpeg, png veya webp (içerikten sezilir), en çok 1 MB. İstemci önce ~512px'e küçültür.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Yüklendi; { avatar_version }' }
        '400': { description: Geçersiz/boş dosya veya izin verilmeyen tür }
        '404': { description: Profil yok veya başka hesaba ait }
        '413': { description: Dosya 1 MB'tan büyük }
    get:
      tags: [expense]
      summary: Profil fotoğrafını getir (ham görsel)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Görsel baytları
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { description: Avatar yok, profil yok veya başka hesaba ait }
    delete:
      tags: [expense]
      summary: Profil fotoğrafını kaldır
      security: [{ bearer: [] }]
      responses:
        '200': { description: 'Kaldırıldı; { avatar_version: 0 }' }
        '404': { description: Profil yok veya başka hesaba ait }
  /expenses/bulk:
    post:
      tags: [expense]
      summary: Toplu, idempotent fiş kaydı (çevrimdışı kuyruk boşaltma ve yedekten içe aktarma)
      description: >-
        En çok 500 fiş. Her fişte `client_uid` zorunludur; hesapta zaten varsa `skipped` olur (mükerrer
        oluşmaz). Geçersiz fişler `error` olarak raporlanır ve diğerlerini engellemez.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expenses]
              properties:
                profile_id: { type: integer, format: int64, description: Fişlerde profile_id yoksa kullanılır }
                expenses:
                  type: array
                  items: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200': { description: Sonuç, content: { application/json: { schema: { $ref: '#/components/schemas/BulkResult' } } } }
        '400': { description: Boş veya 500 den fazla }
  /categories:
    get:
      tags: [expense]
      summary: Kategori listesi
      description: >-
        Sabit taksonomi: Market / Gıda, Restoran / Kafe, Akaryakıt / Ulaşım, Giyim, Elektronik,
        Sağlık / Eczane, Fatura / Abonelik, Ev / Yaşam, Kişisel Bakım, Eğlence / Hobi, Diğer.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /category-rules:
    get:
      tags: [expense]
      summary: Öğrenilen kişisel kategori kuralları
      description: >-
        Kullanıcının, önerilen kategoriyi değiştirerek kaydettiği fiş/kalemlerden öğrenilen kurallar
        (işletme adı ya da kalem adı → kategori). Sonraki tarama/ayrıştırmalarda sözlüğe göre önceliklidir.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: En yeni önce, en fazla 500 kural
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryRule' }
  /category-rules/{id}:
    delete:
      tags: [expense]
      summary: Kişisel kuralı sil
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Silindi }
        '404': { description: Kural yok ya da başkasına ait }
  /receipts/parse:
    post:
      tags: [expense]
      summary: Ham metni yapılandırılmış fiş alanlarına ayrıştır
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedReceipt' }
  /receipts/scan:
    post:
      tags: [expense]
      summary: Görsel, OCR ve ayrıştırma
      description: Görsel yalnızca bellekte işlenir, saklanmaz.
      security: [{ bearer: [] }]
      parameters:
        - name: engine
          in: query
          schema: { type: string, enum: [paddleocr, custom] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  description: Fiş sayfaları (uzun fişler için birden çok fotoğraf, sırayla; en fazla 6 sayfa, her biri en fazla 5 MB, toplam en fazla 30 MB). Sayfa metinleri birleştirilip tek fiş olarak ayrıştırılır.
                  maxItems: 6
                  items: { type: string, format: binary }
                engine: { type: string, enum: [paddleocr, custom] }
      responses:
        '200':
          description: OCR sonucu ve ayrıştırılmış fiş (fiş + kalem kategorileri dahil)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ocr: { $ref: '#/components/schemas/OcrResult' }
                  parsed: { $ref: '#/components/schemas/ParsedReceipt' }
        '400': { description: Dosya yok, boş veya 15 MB'tan büyük }
        '401': { description: Token geçersiz }
        '502': { description: OCR servisi yanıt vermedi }
  /expenses:
    get:
      tags: [expense]
      summary: Harcama listesi
      security: [{ bearer: [] }]
      parameters:
        - { name: profile_id, in: query, description: 'Yalnızca bu profil (hesabın profili olmalı, yoksa 404). Verilmezse hesabın tüm profilleri.', schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Expense' }
    post:
      tags: [expense]
      summary: Harcama oluştur
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '200': { description: Aynı client_uid ile fiş zaten kayıtlı; mevcut kayıt döner (mükerrer oluşmaz) }
        '404': { description: profile_id hesaba ait değil }
  /expenses/{id}/images:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [expense]
      summary: Fişe fotoğraf yükle (hesaba bağlı saklanır)
      description: Başkasının fişine yükleme 404 döner. Tür içerikten sezilir; yalnızca jpeg/png/webp. Fiş başına en fazla 10 fotoğraf, her biri en fazla 5 MB.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201': { description: "`{ image_ids: [..] }`" }
        '400': { description: Dosya yok, desteklenmeyen tür veya 10 fotoğraf sınırı }
        '404': { description: Fiş bulunamadı (veya başkasına ait) }
        '413': { description: Fotoğraf 5 MB'tan veya istek 30 MB'tan büyük }
  /expenses/{id}/images/{imageId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: imageId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [expense]
      summary: Fiş fotoğrafını getir (ham bayt)
      security: [{ bearer: [] }]
      responses:
        '200': { description: Görsel baytları (image/jpeg, image/png veya image/webp) }
        '404': { description: Bulunamadı (veya başkasına ait) }
    delete:
      tags: [expense]
      summary: Fiş fotoğrafını sil
      security: [{ bearer: [] }]
      responses:
        '204': { description: Silindi }
        '404': { description: Bulunamadı (veya başkasına ait) }
  /expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [expense]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { description: Bulunamadı }
    put:
      tags: [expense]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200': { description: Güncellendi }
        '404': { description: Bulunamadı }
    delete:
      tags: [expense]
      security: [{ bearer: [] }]
      responses:
        '204': { description: Silindi }
        '404': { description: Bulunamadı }
  /reports/summary:
    get:
      tags: [expense]
      summary: Haftalık (Pazartesi başlangıçlı) veya aylık kategori dağılımı
      security: [{ bearer: [] }]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month], default: month } }
        - { name: date, in: query, description: Referans tarih (YYYY-MM-DD), schema: { type: string, format: date } }
        - { name: profile_id, in: query, description: Yalnızca bu profil (verilmezse hesabın tüm profilleri), schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
  /ocr/extract:
    post:
      tags: [ocr]
      summary: Görselden metin çıkar
      description: Base64 JSON veya multipart. Görsel diske yazılmaz.
      parameters:
        - name: engine
          in: query
          schema: { type: string, enum: [paddleocr, custom] }
        - name: X-OCR-Engine
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_base64: { type: string }
                engine: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrResult' }
