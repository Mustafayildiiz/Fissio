openapi: 3.0.3
info:
  title: Fissio API
  version: 0.1.0
  description: |
    Fissio mikroservis API sözleşmesi. Üç servis ayrı portlardan yayın yapar:
    auth (:8081), expense (:8082), ocr (:8083).
    Kimlik doğrulama: `Authorization: Bearer <JWT>` (24 saat geçerli).
servers:
  - url: http://localhost:8081
    description: auth
  - url: http://localhost:8082
    description: expense
  - url: http://localhost:8083
    description: ocr
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Item:
      type: object
      properties:
        name: { type: string }
        amount: { type: number }
    ExpenseInput:
      type: object
      properties:
        merchant: { type: string }
        amount: { type: number }
        date: { type: string, format: date }
        category_id: { type: integer }
        note: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    Expense:
      allOf:
        - $ref: '#/components/schemas/ExpenseInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            category_name: { type: string }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        keywords:
          type: array
          items: { type: string }
    ParsedReceipt:
      type: object
      properties:
        merchant: { type: string }
        amount: { type: number, nullable: true }
        date: { type: string, nullable: true }
        category_id: { type: integer }
        category_name: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        confidence:
          type: object
          properties:
            amount: { type: number }
            date: { type: number }
            merchant: { type: number }
            category: { type: number }
        needs_manual:
          type: boolean
          description: Tutar bulunamadıysa true; istemci manuel giriş modalını gösterir.
    OcrResult:
      type: object
      properties:
        raw_text: { type: string }
        blocks:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              confidence: { type: number }
              bbox:
                type: array
                items:
                  type: array
                  items: { type: number }
        confidence: { type: number }
        engine: { type: string, enum: [paddleocr, custom] }
        model_version: { type: string }
        elapsed_ms: { type: number }
        is_empty: { type: boolean }
    ReportSummary:
      type: object
      properties:
        period: { type: string, enum: [week, month] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { type: number }
        count: { type: integer }
        by_category:
          type: array
          items:
            type: object
            properties:
              category_id: { type: integer }
              name: { type: string }
              total: { type: number }
              count: { type: integer }
              percent: { type: number }
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Kayıt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { description: Oluşturuldu (id, email, created_at) }
        '400': { description: Geçersiz e-posta veya şifre }
        '409': { description: E-posta zaten kayıtlı }
  /auth/login:
    post:
      tags: [auth]
      summary: Giriş
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { description: token, expires_at ve user döner }
        '401': { description: E-posta veya şifre hatalı }
  /auth/me:
    get:
      tags: [auth]
      summary: Geçerli kullanıcı
      security: [{ bearer: [] }]
      responses:
        '200': { description: Kullanıcı bilgisi }
        '401': { description: Token geçersiz veya süresi dolmuş }
  /categories:
    get:
      tags: [expense]
      summary: Kategori listesi
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /receipts/parse:
    post:
      tags: [expense]
      summary: Ham metni yapılandırılmış fiş alanlarına ayrıştır
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedReceipt' }
  /receipts/scan:
    post:
      tags: [expense]
      summary: Görsel, OCR ve ayrıştırma
      description: Görsel yalnızca bellekte işlenir, saklanmaz.
      security: [{ bearer: [] }]
      parameters:
        - name: engine
          in: query
          schema: { type: string, enum: [paddleocr, custom] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_base64: { type: string }
                engine: { type: string }
      responses:
        '200': { description: OCR ve ayrıştırma sonucu }
  /expenses:
    get:
      tags: [expense]
      summary: Harcama listesi
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Expense' }
    post:
      tags: [expense]
      summary: Harcama oluştur
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
  /expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [expense]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { description: Bulunamadı }
    put:
      tags: [expense]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200': { description: Güncellendi }
        '404': { description: Bulunamadı }
    delete:
      tags: [expense]
      security: [{ bearer: [] }]
      responses:
        '204': { description: Silindi }
        '404': { description: Bulunamadı }
  /reports/summary:
    get:
      tags: [expense]
      summary: Haftalık (Pazartesi başlangıçlı) veya aylık kategori dağılımı
      security: [{ bearer: [] }]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month], default: month } }
        - { name: date, in: query, description: Referans tarih (YYYY-MM-DD), schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
  /ocr/extract:
    post:
      tags: [ocr]
      summary: Görselden metin çıkar
      description: Base64 JSON veya multipart. Görsel diske yazılmaz.
      parameters:
        - name: engine
          in: query
          schema: { type: string, enum: [paddleocr, custom] }
        - name: X-OCR-Engine
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_base64: { type: string }
                engine: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrResult' }
